<script>
    let scene, camera, renderer, earthGroup, cloudMesh, atmosphereMesh;
    let mainCrust, coreMesh, mantleMesh;
    let crustDebris = [], dustParticles, debrisParticles;
    let tornados = [], tornadoParticles = [];
    let weatherState = 'normal';
    let isExploded = false, isCracking = false;
    let explosionProgress = 0, crackProgress = 0;
    let reassembling = false, reassembleTimer = 0;

    let detector = null;
    let videoElement = document.getElementById('webcam-video');
    let weatherStatusEl = document.getElementById('weather-status');
    let gestureStatusEl = document.getElementById('gesture-status');

    let globeRotation = { x: 0.25, y: 0 };
    let targetRotation = { x: 0.25, y: 0 };
    let targetScale = 1.0;
    let currentScale = 1.0;
    let isDragging = false;
    let previousMousePosition = { x: 0, y: 0 };
    let lastMiddleFingerTime = 0;
    let lastThumbsDownTime = 0;

    let rainSystem, lightningLight;
    let rumbleIntensity = 0;
    let shakeOffset = new THREE.Vector3();

    async function init() {
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 18;

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        container.appendChild(renderer.domElement);

        scene.add(new THREE.AmbientLight(0xffffff, 0.7));
        const sun = new THREE.DirectionalLight(0xfff5e0, 1.6);
        sun.position.set(18, 12, 15);
        scene.add(sun);

        lightningLight = new THREE.PointLight(0xaaccff, 0, 60);
        scene.add(lightningLight);

        createStarfield();
        buildEarthSystem();
        setupWeatherSystems();

        window.addEventListener('resize', onWindowResize);
        setupMouseControls();

        await initHandTracking();
        document.getElementById('loading').style.display = 'none';
        animate();
    }

    // ---------- Better continuous cartoon Earth texture ----------
    function createCartoonEarthTexture() {
        const canvas = document.createElement('canvas');
        canvas.width = 2048;
        canvas.height = 1024;
        const ctx = canvas.getContext('2d');

        // Ocean
        const g = ctx.createLinearGradient(0, 0, 0, canvas.height);
        g.addColorStop(0, '#0a3d6e');
        g.addColorStop(0.5, '#1a6bb5');
        g.addColorStop(1, '#0a3d6e');
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Soft ocean glow
        ctx.fillStyle = 'rgba(30,140,220,0.22)';
        ctx.beginPath();
        ctx.ellipse(1024, 512, 900, 420, 0, 0, Math.PI * 2);
        ctx.fill();

        // Polar ice
        ctx.fillStyle = '#e8f4ff';
        ctx.beginPath(); ctx.ellipse(1024, 70, 720, 85, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(1024, 955, 680, 75, 0, 0, Math.PI * 2); ctx.fill();

        function blob(cx, cy, pts, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(cx + pts[0][0], cy + pts[0][1]);
            for (let i = 1; i < pts.length; i++) ctx.lineTo(cx + pts[i][0], cy + pts[i][1]);
            ctx.closePath();
            ctx.fill();
        }

        // Continents (more recognisable shapes)
        blob(420, 310, [[-95,-75],[-45,-115],[55,-105],[115,-55],[105,15],[55,75],[-5,105],[-75,85],[-125,35],[-115,-25]], '#4caf50'); // N America
        blob(520, 620, [[-45,-95],[25,-105],[55,-45],[45,35],[5,95],[-35,115],[-65,65],[-75,-5],[-55,-55]], '#66bb6a'); // S America
        blob(1180, 300, [[-185,-85],[-85,-115],[45,-105],[165,-75],[225,-25],[205,35],[125,85],[25,95],[-85,75],[-165,35],[-205,-15]], '#43a047'); // Eurasia
        blob(980, 520, [[-75,-115],[-25,-125],[55,-105],[85,-45],[75,45],[35,115],[-35,125],[-75,65],[-95,-5],[-85,-55]], '#558b2f'); // Africa
        blob(1550, 700, [[-60,-45],[15,-60],[65,-35],[60,15],[25,45],[-35,40],[-65,5]], '#7cb342'); // Australia
        blob(380, 155, [[-45,-35],[25,-40],[50,-5],[25,35],[-35,30],[-55,0]], '#a5d6a7'); // Greenland

        // Deserts
        ctx.fillStyle = '#ffd54f';
        ctx.beginPath(); ctx.ellipse(1050, 475, 60, 42, 0.2, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(1300, 340, 75, 38, -0.1, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(1580, 680, 38, 28, 0, 0, Math.PI * 2); ctx.fill();

        // Soft mountain highlights
        ctx.fillStyle = 'rgba(255,255,255,0.22)';
        ctx.beginPath(); ctx.ellipse(420, 275, 45, 28, 0, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.ellipse(1200, 255, 90, 32, 0, 0, Math.PI * 2); ctx.fill();

        return new THREE.CanvasTexture(canvas);
    }

    function createCrackOverlay() {
        const canvas = document.createElement('canvas');
        canvas.width = 1024;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, 1024, 512);

        ctx.strokeStyle = 'rgba(20,10,5,0.85)';
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        for (let i = 0; i < 22; i++) {
            ctx.beginPath();
            let x = Math.random() * 1024, y = Math.random() * 512;
            ctx.moveTo(x, y);
            for (let j = 0; j < 10; j++) {
                x += (Math.random() - 0.5) * 100;
                y += (Math.random() - 0.5) * 80;
                ctx.lineTo(x, y);
            }
            ctx.stroke();
        }
        ctx.lineWidth = 2;
        for (let i = 0; i < 35; i++) {
            ctx.beginPath();
            let x = Math.random() * 1024, y = Math.random() * 512;
            ctx.moveTo(x, y);
            for (let j = 0; j < 6; j++) {
                x += (Math.random() - 0.5) * 55;
                y += (Math.random() - 0.5) * 45;
                ctx.lineTo(x, y);
            }
            ctx.stroke();
        }
        return new THREE.CanvasTexture(canvas);
    }

    function buildEarthSystem() {
        earthGroup = new THREE.Group();
        scene.add(earthGroup);

        // Core
        coreMesh = new THREE.Mesh(
            new THREE.SphereGeometry(1.15, 32, 32),
            new THREE.MeshBasicMaterial({ color: 0xfff8e1 })
        );
        earthGroup.add(coreMesh);
        coreMesh.add(new THREE.PointLight(0xffaa33, 2.5, 12));

        // Mantle
        mantleMesh = new THREE.Mesh(
            new THREE.SphereGeometry(2.35, 48, 48),
            new THREE.MeshStandardMaterial({
                color: 0xff3300,
                emissive: 0xff2200,
                emissiveIntensity: 0.9,
                roughness: 0.35,
                metalness: 0.2
            })
        );
        earthGroup.add(mantleMesh);

        // ===== MAIN CONTINUOUS CRUST (this is what you see in normal state) =====
        const earthTex = createCartoonEarthTexture();
        const crackTex = createCrackOverlay();

        const crustMat = new THREE.MeshStandardMaterial({
            map: earthTex,
            bumpMap: crackTex,
            bumpScale: 0.12,
            roughness: 0.65,
            metalness: 0.08
        });

        mainCrust = new THREE.Mesh(
            new THREE.SphereGeometry(3.55, 64, 64),
            crustMat
        );
        earthGroup.add(mainCrust);

        // Pre-create debris pieces for the explosion (hidden until needed)
        for (let i = 0; i < 36; i++) {
            const size = 0.45 + Math.random() * 0.55;
            const geo = new THREE.BoxGeometry(size, size * 0.7, size * 0.5);
            const mat = new THREE.MeshStandardMaterial({
                map: earthTex,
                roughness: 0.7,
                metalness: 0.1,
                flatShading: true
            });
            const piece = new THREE.Mesh(geo, mat);

            // Place them on the surface initially (will be moved on explode)
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.acos(2 * Math.random() - 1);
            const r = 3.55;
            piece.position.set(
                r * Math.sin(phi) * Math.cos(theta),
                r * Math.cos(phi),
                r * Math.sin(phi) * Math.sin(theta)
            );
            piece.lookAt(0, 0, 0);
            piece.visible = false;

            piece.userData = {
                startPos: piece.position.clone(),
                explosionDir: piece.position.clone().normalize().multiplyScalar(6 + Math.random() * 5),
                rotSpeed: new THREE.Vector3(
                    (Math.random() - 0.5) * 0.15,
                    (Math.random() - 0.5) * 0.15,
                    (Math.random() - 0.5) * 0.1
                )
            };
            earthGroup.add(piece);
            crustDebris.push(piece);
        }

        // Clouds
        const cloudCanvas = document.createElement('canvas');
        cloudCanvas.width = 1024; cloudCanvas.height = 512;
        const cCtx = cloudCanvas.getContext('2d');
        cCtx.fillStyle = 'rgba(255,255,255,0)';
        cCtx.fillRect(0, 0, 1024, 512);
        cCtx.fillStyle = 'rgba(255,255,255,0.8)';
        for (let c = 0; c < 30; c++) {
            const x = Math.random() * 1024, y = Math.random() * 512, r = 20 + Math.random() * 50;
            cCtx.beginPath(); cCtx.arc(x, y, r, 0, Math.PI * 2); cCtx.fill();
            cCtx.beginPath(); cCtx.arc(x + (Math.random()-0.5)*35, y + (Math.random()-0.5)*25, r*0.6, 0, Math.PI * 2); cCtx.fill();
        }
        cloudMesh = new THREE.Mesh(
            new THREE.SphereGeometry(3.72, 48, 48),
            new THREE.MeshStandardMaterial({
                map: new THREE.CanvasTexture(cloudCanvas),
                transparent: true,
                opacity: 0.65,
                depthWrite: false
            })
        );
        earthGroup.add(cloudMesh);

        // Atmosphere
        atmosphereMesh = new THREE.Mesh(
            new THREE.SphereGeometry(3.95, 48, 48),
            new THREE.MeshBasicMaterial({
                color: 0x4facfe,
                transparent: true,
                opacity: 0.14,
                side: THREE.BackSide
            })
        );
        scene.add(atmosphereMesh);

        // Dust
        const dustGeo = new THREE.BufferGeometry();
        const dustCount = 400;
        const dustPos = new Float32Array(dustCount * 3);
        for (let i = 0; i < dustCount * 3; i++) dustPos[i] = (Math.random() - 0.5) * 14;
        dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
        dustParticles = new THREE.Points(dustGeo, new THREE.PointsMaterial({
            color: 0xff9944, size: 0.12, transparent: true, opacity: 0, depthWrite: false
        }));
        scene.add(dustParticles);

        // Small flying debris particles
        const debGeo = new THREE.BufferGeometry();
        const debCount = 180;
        const debPos = new Float32Array(debCount * 3);
        const debVel = [];
        for (let i = 0; i < debCount; i++) {
            debPos[i*3] = debPos[i*3+1] = debPos[i*3+2] = 0;
            debVel.push(new THREE.Vector3(
                (Math.random()-0.5)*0.4,
                (Math.random()-0.5)*0.4,
                (Math.random()-0.5)*0.4
            ));
        }
        debGeo.setAttribute('position', new THREE.BufferAttribute(debPos, 3));
        debrisParticles = new THREE.Points(debGeo, new THREE.PointsMaterial({
            color: 0xff6622, size: 0.16, transparent: true, opacity: 0, depthWrite: false
        }));
        debrisParticles.userData.velocities = debVel;
        scene.add(debrisParticles);
    }

    function createStarfield() {
        const geo = new THREE.BufferGeometry();
        const count = 1200;
        const pos = new Float32Array(count * 3);
        for (let i = 0; i < count * 3; i++) pos[i] = (Math.random() - 0.5) * 280;
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.7 })));
    }

    function setupWeatherSystems() {
        // Rain
        const rainGeo = new THREE.BufferGeometry();
        const rainCount = 800;
        const rainPos = new Float32Array(rainCount * 3);
        const rainVel = new Float32Array(rainCount);
        for (let i = 0; i < rainCount; i++) {
            rainPos[i*3] = (Math.random() - 0.5) * 18;
            rainPos[i*3+1] = Math.random() * 16 - 2;
            rainPos[i*3+2] = (Math.random() - 0.5) * 18;
            rainVel[i] = 0.18 + Math.random() * 0.22;
        }
        rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
        rainGeo.userData = { velocities: rainVel };
        rainSystem = new THREE.Points(rainGeo, new THREE.PointsMaterial({
            color: 0x88ccff, size: 0.08, transparent: true, opacity: 0, depthWrite: false
        }));
        scene.add(rainSystem);

        // Tornados
        for (let t = 0; t < 2; t++) {
            const funnel = new THREE.Mesh(
                new THREE.CylinderGeometry(0.15, 1.4, 4.2, 24, 12, true),
                new THREE.MeshBasicMaterial({
                    color: 0x667788, transparent: true, opacity: 0, side: THREE.DoubleSide
                })
            );
            funnel.position.set(t === 0 ? 5.5 : -5.5, 0.8, 0);
            funnel.userData = { phase: t * Math.PI };
            scene.add(funnel);
            tornados.push(funnel);

            const pGeo = new THREE.BufferGeometry();
            const pCount = 120;
            const pPos = new Float32Array(pCount * 3);
            pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
            const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
                color: 0x998877, size: 0.09, transparent: true, opacity: 0, depthWrite: false
            }));
            particles.userData = { parent: funnel, count: pCount };
            scene.add(particles);
            tornadoParticles.push(particles);
        }
    }

    // ---------- Explosion logic ----------
    function triggerCrackAndExplosion() {
        if (isExploded || isCracking || reassembling) return;
        isCracking = true;
        crackProgress = 0;
        gestureStatusEl.innerText = "Gesture: CRACKING...";
        gestureStatusEl.style.background = "rgba(255,140,0,0.45)";
    }

    function triggerReassembly() {
        if (!isExploded || reassembling) return;
        reassembling = true;
        isExploded = false;
        reassembleTimer = 0;
        gestureStatusEl.innerText = "Gesture: Magnetic Reassembly";
        gestureStatusEl.style.background = "rgba(0,242,254,0.45)";
    }

    function cycleWeather() {
        const now = Date.now();
        if (now - lastMiddleFingerTime < 2200) return;
        lastMiddleFingerTime = now;

        if (weatherState === 'normal') {
            weatherState = 'rain';
            weatherStatusEl.innerText = "Weather: Raining 🌧️";
            rainSystem.material.opacity = 0.75;
        } else if (weatherState === 'rain') {
            weatherState = 'storm';
            weatherStatusEl.innerText = "Weather: Storms ⚡🌪️";
            rainSystem.material.opacity = 0.85;
            tornados.forEach(t => t.material.opacity = 0.55);
            tornadoParticles.forEach(p => p.material.opacity = 0.6);
        } else if (weatherState === 'storm') {
            weatherState = 'rumble';
            weatherStatusEl.innerText = "Weather: Rumbling 🌋";
            rainSystem.material.opacity = 0;
            tornados.forEach(t => t.material.opacity = 0);
            tornadoParticles.forEach(p => p.material.opacity = 0);
            rumbleIntensity = 1.0;
        } else {
            weatherState = 'normal';
            weatherStatusEl.innerText = "Weather: Normal ☀️";
            rainSystem.material.opacity = 0;
            tornados.forEach(t => t.material.opacity = 0);
            tornadoParticles.forEach(p => p.material.opacity = 0);
            rumbleIntensity = 0;
        }
    }

    // ---------- Hand tracking (same as before) ----------
    async function initHandTracking() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 320, height: 240 } });
            videoElement.srcObject = stream;
            await new Promise(r => { videoElement.onloadedmetadata = r; });
            videoElement.play();

            detector = await handPoseDetection.createDetector(
                handPoseDetection.SupportedModels.MediaPipeHands,
                {
                    runtime: 'mediapipe',
                    solutionPath: 'https://cdn.jsdelivr.net/npm/@mediapipe/hands',
                    modelType: 'full',
                    maxHands: 2
                }
            );
            detectHands();
        } catch (err) {
            console.warn("Webcam unavailable:", err);
            gestureStatusEl.innerText = "Gesture: Mouse Mode Active";
        }
    }

    async function detectHands() {
        if (detector && videoElement.readyState === 4) {
            try {
                const hands = await detector.estimateHands(videoElement, { flipHorizontal: true });
                processGestures(hands);
            } catch (e) { console.error(e); }
        }
        setTimeout(detectHands, 90);
    }

    function isFingerExtended(kp, tip, pip) { return kp[tip].y < kp[pip].y - 8; }
    function isFingerCurled(kp, tip, pip) { return kp[tip].y > kp[pip].y + 5; }

    function processGestures(hands) {
        if (!hands || hands.length === 0) {
            gestureStatusEl.innerText = "Gesture: No hands detected";
            return;
        }

        let thumbsDownCount = 0, middleFingerDetected = false;
        let openHandCount = 0, closedFistCount = 0;

        hands.forEach(hand => {
            const kp = hand.keypoints;

            if (kp[4].y > kp[2].y + 10 && kp[4].y > kp[3].y) thumbsDownCount++;

            const midExt = isFingerExtended(kp, 12, 10);
            const idxCurl = isFingerCurled(kp, 8, 6);
            const ringCurl = isFingerCurled(kp, 16, 14);
            const pinkyCurl = isFingerCurled(kp, 20, 18);
            if (midExt && idxCurl && ringCurl && pinkyCurl) middleFingerDetected = true;

            const openScore = [8,12,16,20].filter((t,i) => isFingerExtended(kp, t, [6,10,14,18][i])).length;
            if (openScore >= 3) openHandCount++;

            const curlScore = [8,12,16,20].filter((t,i) => isFingerCurled(kp, t, [6,10,14,18][i])).length;
            if (curlScore >= 3 && !isFingerExtended(kp, 4, 2)) closedFistCount++;
        });

        if (thumbsDownCount >= 2) {
            const now = Date.now();
            if (!isExploded && !isCracking && !reassembling && now - lastThumbsDownTime > 3500) {
                lastThumbsDownTime = now;
                triggerCrackAndExplosion();
            }
        }

        if (middleFingerDetected) cycleWeather();

        if (openHandCount > 0 && hands[0]) {
            const wrist = hands[0].keypoints[0];
            targetRotation.y = ((wrist.x / 320) - 0.5) * Math.PI * 1.4;
            targetRotation.x = ((wrist.y / 240) - 0.5) * Math.PI * 0.9;
            gestureStatusEl.innerText = "Gesture: Rotating Globe";
        }

        if (closedFistCount > 0 && hands[0]) {
            const yNorm = 1.0 - (hands[0].keypoints[0].y / 240);
            targetScale = 0.55 + yNorm * 0.9;
            gestureStatusEl.innerText = "Gesture: Scaling Globe";
        }
    }

    function setupMouseControls() {
        window.addEventListener('mousedown', e => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mousemove', e => {
            if (!isDragging) return;
            targetRotation.y += (e.clientX - previousMousePosition.x) * 0.005;
            targetRotation.x += (e.clientY - previousMousePosition.y) * 0.005;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });
        window.addEventListener('mouseup', () => isDragging = false);
        window.addEventListener('wheel', e => {
            targetScale = Math.max(0.5, Math.min(1.6, targetScale - e.deltaY * 0.001));
        });
        window.addEventListener('dblclick', () => {
            if (!isExploded && !isCracking) triggerCrackAndExplosion();
        });
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // ---------- Animation ----------
    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now() * 0.001;

        globeRotation.x += (targetRotation.x - globeRotation.x) * 0.12;
        globeRotation.y += (targetRotation.y - globeRotation.y) * 0.12;
        currentScale += (targetScale - currentScale) * 0.1;

        earthGroup.rotation.x = globeRotation.x;
        earthGroup.rotation.y = globeRotation.y;
        earthGroup.scale.setScalar(currentScale);

        if (!isExploded && !isCracking && !reassembling) {
            earthGroup.rotation.y += 0.0018;
        }
        if (cloudMesh) cloudMesh.rotation.y += 0.0009;

        // Crack phase
        if (isCracking) {
            crackProgress += 0.016;
            mainCrust.material.bumpScale = 0.12 + crackProgress * 0.7;
            mantleMesh.material.emissiveIntensity = 0.9 + crackProgress * 1.4;
            dustParticles.material.opacity = Math.min(0.65, crackProgress * 0.85);

            if (crackProgress >= 1.0) {
                isCracking = false;
                isExploded = true;
                explosionProgress = 0;

                // Hide continuous crust, show debris
                mainCrust.visible = false;
                cloudMesh.visible = false;
                crustDebris.forEach(p => {
                    p.visible = true;
                    p.position.copy(p.userData.startPos);
                });

                debrisParticles.material.opacity = 0.9;
                const dPos = debrisParticles.geometry.attributes.position.array;
                debrisParticles.userData.velocities.forEach((v, i) => {
                    dPos[i*3] = (Math.random()-0.5)*1.5;
                    dPos[i*3+1] = (Math.random()-0.5)*1.5;
                    dPos[i*3+2] = (Math.random()-0.5)*1.5;
                    v.set((Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5, (Math.random()-0.5)*0.5);
                });
                debrisParticles.geometry.attributes.position.needsUpdate = true;

                gestureStatusEl.innerText = "Gesture: ERUPTION!";
                gestureStatusEl.style.background = "rgba(255,50,0,0.5)";
                setTimeout(triggerReassembly, 4800);
            }
        }

        // Explosion
        if (isExploded && explosionProgress < 1) {
            explosionProgress += 0.014;
            crustDebris.forEach(p => {
                p.position.lerp(p.userData.explosionDir, 0.06);
                p.rotation.x += p.userData.rotSpeed.x;
                p.rotation.y += p.userData.rotSpeed.y;
                p.rotation.z += p.userData.rotSpeed.z;
            });

            const dPos = debrisParticles.geometry.attributes.position.array;
            debrisParticles.userData.velocities.forEach((v, i) => {
                dPos[i*3] += v.x;
                dPos[i*3+1] += v.y;
                dPos[i*3+2] += v.z;
                v.multiplyScalar(0.98);
            });
            debrisParticles.geometry.attributes.position.needsUpdate = true;
        }

        // Reassembly
        if (reassembling) {
            reassembleTimer += 0.016;
            dustParticles.material.opacity = Math.max(0, dustParticles.material.opacity - 0.025);
            debrisParticles.material.opacity = Math.max(0, debrisParticles.material.opacity - 0.03);

            let allIn = true;
            crustDebris.forEach(p => {
                p.position.lerp(p.userData.startPos, 0.09);
                p.rotation.x *= 0.87;
                p.rotation.y *= 0.87;
                p.rotation.z *= 0.87;
                if (p.position.distanceTo(p.userData.startPos) > 0.15) allIn = false;
            });

            if (allIn || reassembleTimer > 3.8) {
                reassembling = false;
                crustDebris.forEach(p => p.visible = false);
                mainCrust.visible = true;
                cloudMesh.visible = true;
                mainCrust.material.bumpScale = 0.12;
                mantleMesh.material.emissiveIntensity = 0.9;
                gestureStatusEl.innerText = "Gesture: Reassembled!";
                gestureStatusEl.style.background = "rgba(255,255,255,0.15)";
            }
        }

        // Rain
        if (weatherState === 'rain' || weatherState === 'storm') {
            const pos = rainSystem.geometry.attributes.position.array;
            const vels = rainSystem.geometry.userData.velocities;
            for (let i = 0; i < vels.length; i++) {
                pos[i*3+1] -= vels[i];
                if (pos[i*3+1] < -6) {
                    pos[i*3+1] = 12 + Math.random()*4;
                    pos[i*3] = (Math.random()-0.5)*18;
                    pos[i*3+2] = (Math.random()-0.5)*18;
                }
            }
            rainSystem.geometry.attributes.position.needsUpdate = true;
        }

        // Storm + tornados
        if (weatherState === 'storm') {
            tornados.forEach((t, idx) => {
                t.rotation.y += 0.18 + idx * 0.04;
                const phase = time * 0.7 + t.userData.phase;
                t.position.x = Math.sin(phase) * 5.8;
                t.position.z = Math.cos(phase) * 5.8;
                t.position.y = 0.6 + Math.sin(time * 1.4 + idx) * 0.35;
            });

            tornadoParticles.forEach(p => {
                const parent = p.userData.parent;
                const count = p.userData.count;
                const pos = p.geometry.attributes.position.array;
                for (let i = 0; i < count; i++) {
                    const a = time * 3.5 + i * 0.4;
                    const r = 0.3 + (i % 8) * 0.18;
                    const h = ((i * 0.07 + time * 1.2) % 4.2) - 2.1;
                    pos[i*3]   = parent.position.x + Math.cos(a) * r * (1.1 - h * 0.15);
                    pos[i*3+1] = parent.position.y + h;
                    pos[i*3+2] = parent.position.z + Math.sin(a) * r * (1.1 - h * 0.15);
                }
                p.geometry.attributes.position.needsUpdate = true;
            });

            if (Math.random() < 0.025) {
                lightningLight.intensity = 6 + Math.random() * 4;
                lightningLight.position.set(
                    (Math.random()-0.5)*8,
                    (Math.random()-0.5)*6,
                    (Math.random()-0.5)*8
                );
                setTimeout(() => lightningLight.intensity = 0, 70 + Math.random()*60);
            }
        }

        // Smooth rumble
        if (weatherState === 'rumble') rumbleIntensity = Math.min(1.2, rumbleIntensity + 0.02);
        else rumbleIntensity *= 0.94;

        if (rumbleIntensity > 0.01) {
            const s = rumbleIntensity * 0.14;
            shakeOffset.x = Math.sin(time * 28) * s + Math.sin(time * 41) * s * 0.4;
            shakeOffset.y = Math.cos(time * 33) * s * 0.7;
            shakeOffset.z = Math.sin(time * 19) * s * 0.3;
            earthGroup.position.copy(shakeOffset);
            coreMesh.scale.setScalar(1 + Math.sin(time * 9) * 0.03 * rumbleIntensity);
        } else {
            earthGroup.position.set(0, 0, 0);
            coreMesh.scale.setScalar(1);
        }

        renderer.render(scene, camera);
    }

    init();
</script>
